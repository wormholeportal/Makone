<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 248" width="880" height="248" role="img" aria-label="The agent reads skills and writes worlds built on the runtime; the harness renders them and returns frames and facts to the agent.">
  <style>
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12.5px; font-weight: 600; fill: #16191d; letter-spacing: -.01em; }
    .ser  { font-family: "Times New Roman", Times, "Nimbus Roman", Georgia, serif;
            font-size: 11.5px; fill: #4a5058; }
    .it   { font-family: "Times New Roman", Times, "Nimbus Roman", Georgia, serif;
            font-size: 11px; font-style: italic; fill: #4a5058; }
    .box  { fill: none; stroke: #16191d; stroke-width: 1; }
    .key  { fill: #f2f2ef; stroke: #16191d; stroke-width: 1; }
    .ln   { stroke: #16191d; stroke-width: 1; fill: none; }
    .fb   { stroke: #8a6d00; stroke-width: 1.2; fill: none; stroke-dasharray: 5 3; }
    .mk   { fill: #8a6d00; }
    .mn   { fill: #16191d; }
    .ac   { fill: #8a6d00; }
    @media (prefers-color-scheme: dark) {
      .mono { fill: #e6edf3; }
      .ser, .it { fill: #9aa4af; }
      .box, .ln { stroke: #c9d1d9; }
      .mn  { fill: #c9d1d9; }
      .key { fill: #1c2128; stroke: #c9d1d9; }
      .fb { stroke: #e3b341; }
      .mk, .ac { fill: #e3b341; }
    }
  </style>
  <defs>
    <marker id="h1" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L7.4,4 L0,7 z" class="mn"/>
    </marker>
    <marker id="h2" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L7.4,4 L0,7 z" class="mk"/>
    </marker>
  </defs>

  <rect class="box" x="34"  y="14" width="196" height="46" rx="2"/>
  <text class="mono" x="132" y="34" text-anchor="middle">skills/</text>
  <text class="ser"  x="132" y="50" text-anchor="middle">what good looks like</text>

  <rect class="box" x="342" y="14" width="196" height="46" rx="2"/>
  <text class="mono" x="440" y="34" text-anchor="middle">runtime/</text>
  <text class="ser"  x="440" y="50" text-anchor="middle">contract · CSG · actors</text>

  <rect class="key" x="34"  y="112" width="196" height="52" rx="2"/>
  <text class="mono" x="132" y="134" text-anchor="middle">agent</text>
  <text class="ser"     x="132" y="151" text-anchor="middle">Claude Code · Codex · Cursor</text>

  <rect class="box" x="342" y="112" width="196" height="52" rx="2"/>
  <text class="mono" x="440" y="134" text-anchor="middle">worlds/</text>
  <text class="ser"  x="440" y="151" text-anchor="middle">the work</text>

  <rect class="box" x="650" y="112" width="196" height="52" rx="2"/>
  <text class="mono" x="748" y="134" text-anchor="middle">harness/</text>
  <text class="ser"  x="748" y="151" text-anchor="middle">frames · measured facts</text>

  <path class="ln" d="M132,112 L132,66" marker-end="url(#h1)"/>
  <text class="it" x="140" y="93">reads</text>

  <path class="ln" d="M440,112 L440,66" marker-end="url(#h1)"/>
  <text class="it" x="448" y="93">builds on</text>

  <path class="ln" d="M230,138 L336,138" marker-end="url(#h1)"/>
  <text class="it" x="283" y="131" text-anchor="middle">writes</text>

  <path class="ln" d="M538,138 L644,138" marker-end="url(#h1)"/>
  <text class="it" x="591" y="131" text-anchor="middle">renders</text>

  <path class="fb" d="M748,164 L748,204 L132,204 L132,170" marker-end="url(#h2)"/>
  <text class="it" x="440" y="221" text-anchor="middle" style="fill:#8a6d00">frames + facts: the agent looks at what it made</text>
</svg>
