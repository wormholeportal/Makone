<?xml version="1.0" encoding="UTF-8"?>
<!-- 品牌标记 —— 和 MakoneLift codeone/viewer/home.html 的 Logo 同一套几何：
     6 片花瓣（半径 15、rx 4.5 / ry 8）+ 半径 6.5 的内圆，20s 一圈慢转。
     那边是 JS 按主题现画的，这里只取亮色一套，因为本站没有暗色主题。 -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="48"
     height="48"
     viewBox="0 0 48 48"
     fill="none"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Makone</title>
  <desc id="desc">Six gold petals in a ring around a gold centre.</desc>

  <style>
    .spin{animation:spin 20s linear infinite;transform-origin:24px 24px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  </style>

  <g class="spin" fill="#D4A800" fill-opacity="0.85" stroke="#9A7B00" stroke-width="1.5">
    <ellipse cx="39.00" cy="24.00" rx="4.5" ry="8" transform="rotate(0 39.00 24.00)"/>
    <ellipse cx="31.50" cy="36.99" rx="4.5" ry="8" transform="rotate(60 31.50 36.99)"/>
    <ellipse cx="16.50" cy="36.99" rx="4.5" ry="8" transform="rotate(120 16.50 36.99)"/>
    <ellipse cx="9.00" cy="24.00" rx="4.5" ry="8" transform="rotate(180 9.00 24.00)"/>
    <ellipse cx="16.50" cy="11.01" rx="4.5" ry="8" transform="rotate(240 16.50 11.01)"/>
    <ellipse cx="31.50" cy="11.01" rx="4.5" ry="8" transform="rotate(300 31.50 11.01)"/>
    <circle cx="24" cy="24" r="6.5"/>
  </g>
</svg>
