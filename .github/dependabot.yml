version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vite-react:
        patterns:
          - vite
          - "@vitejs/*"
          - react
          - react-dom
          - react-router*
      three-physics:
        patterns:
          - three
          - "@dimforge/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
